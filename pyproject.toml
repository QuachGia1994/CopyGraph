[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "copygraph"
version = "0.3.0"
description = "Evidence-first MT5 copy-trading similarity analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "QuachGia1994" }]
dependencies = []

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.6180,<6; platform_system == 'Windows'"]

[project.scripts]
copygraph = "copygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
